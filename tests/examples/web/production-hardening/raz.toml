[package]
name = "raz-web-production-hardening"
version = "0.1.0"
kind = "executable"
source = "src"
entry = "src/main.rz"

[build]
target = "web"

[dependencies]
web = "raz:web"

[web]
title = "Raz Web Production Hardening"

[web.budget]
total = 5000000
html = 250000
css = 250000
javascript = 500000
wasm = 4000000
metadata = 250000
assets = 1000000
