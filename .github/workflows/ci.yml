name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate release-facing source contracts
        run: python tests/python/check-source.py

  windows-compiler:
    name: Windows compiler reproducibility
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RAZ_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and qualify all retained stages
        shell: pwsh
        run: .\bootstrap.bat -BootstrapProfile release -HostPreset release -RunTests
