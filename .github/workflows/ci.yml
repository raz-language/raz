name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push/PR revision supersedes an older run. Bootstrap qualification is
# expensive, so do not burn runner time proving a commit that is no longer current.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate source contracts
        run: python tests/python/check-source.py

  bootstrap-and-test:
    name: Bootstrap + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RAZ_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bootstrap, prove reproducibility, and run CTest (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./bootstrap.sh --bootstrap-profile release --host-preset release --verify-reproducibility --run-tests --jobs 2
      - name: Bootstrap, prove reproducibility, and run CTest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\bootstrap.bat -BootstrapProfile release -HostPreset release -RunTests -Jobs 2
