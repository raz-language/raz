name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate source contracts
        run: python tests/python/check-source.py

  embedded-components:
    name: Embedded Forge and ObLink are exact mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Raz
        uses: actions/checkout@v5
        with:
          path: raz
      - name: Check out standalone Forge
        uses: actions/checkout@v5
        with:
          repository: raz-language/forge
          path: forge
      - name: Check out standalone ObLink
        uses: actions/checkout@v5
        with:
          repository: raz-language/oblink
          path: oblink
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject component drift
        run: >-
          python raz/tools/check-embedded-components.py
          --forge-root forge
          --oblink-root oblink

  bootstrap-and-test:
    name: Bootstrap + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RAZ_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bootstrap, prove reproducibility, and run CTest (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ./bootstrap.sh --bootstrap-profile release --host-preset release --verify-reproducibility --run-tests --jobs 2
      - name: Bootstrap, prove reproducibility, and run CTest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\bootstrap.bat -BootstrapProfile release -HostPreset release -RunTests -Jobs 2
