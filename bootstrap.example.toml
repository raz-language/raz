# Raz source-tree bootstrap configuration.
# Copy this file to bootstrap.toml and edit only the values you need.

[bootstrap]
# CMake preset used for the native host compiler/runtime/Forge build.
host-preset = "release"

# Profile used when the compatibility host constructs the production Raz compiler.
bootstrap-profile = "debug"

# Parallelism for the native CMake/Ninja portion of the bootstrap.
jobs = 16

# Progress heartbeat while a self-hosted compiler generation is running.
status-interval = 15

# Optional qualification controls.
run-tests = false
clean = false
