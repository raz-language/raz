# Raz source-tree bootstrap configuration.
# Copy this file to bootstrap.toml and edit only the values you need.

[bootstrap]
# CMake preset used for the native stage-0 compiler/runtime/Forge build.
host-preset = "release"

# Qualification profile. This controls the default recursive optimization
# policy (debug -> O0, release -> O2) and reproducibility artifact layout.
bootstrap-profile = "debug"

# The disposable compatibility-host seed is intentionally a fast O1 compiler by
# default. It only seeds Raz-owned recursive generations; it does not change the
# final reproducibility optimization policy. Set to 0 for bootstrap debugging.
seed-opt = "1"

# Optimization level used by the Raz-owned self-host generation (and by the
# optional second reproducibility-verification generation). Release qualification
# defaults to 2; debug qualification defaults to 0.
# repro-opt = "2"

# Parallelism for the native CMake/Ninja portion of the bootstrap.
jobs = 16

# Progress heartbeat while a self-hosted compiler generation is running.
status-interval = 15

# AArch64 only: compatible prebuilt Raz compiler used to cross the initial
# bootstrap boundary until Forge has an AArch64 machine backend.
# stage0 = "/path/to/raz"

# Optional qualification controls. Normal bootstrap performs one self-host
# generation. Enable this only when a release/CI job needs byte-for-byte
# fixed-point verification with a second independent generation.
verify-reproducibility = false
run-tests = false
clean = false

# Stage 0 is cached after its first successful build and reused on subsequent
# bootstraps. Set this only when intentionally changing/fixing the frozen C++
# bootstrap boundary; -Clean also removes the cached Stage-0 build.
rebuild-stage0 = false
